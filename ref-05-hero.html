<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Top-Notch Mechanical Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:#e8e8e5;
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  position:relative;
  overflow:hidden;
}

/* ━━━ 내비게이션 ━━━ */
nav{
  position:fixed;top:0;left:0;right:0;
  z-index:100;
  padding:24px 48px;
  display:flex;align-items:flex-start;justify-content:space-between;
}

/* 좌상단 로고 — 점선 박스 */
.logo-box{
  border:1.5px dashed rgba(0,0,0,.28);
  border-radius:7px;
  padding:7px 12px;
  display:inline-block;
}
/* 원본에서 'ко' 처럼 보이는 로고: 작은 원과 심볼 조합 */
.logo-txt{
  font-size:18px;font-weight:800;
  color:#111;letter-spacing:-.03em;
  display:flex;align-items:center;gap:4px;
}
.logo-sym{
  width:10px;height:10px;border-radius:50%;
  border:1.5px solid #111;display:inline-block;
}

/* 중앙 내비 링크 (2열 그리드) */
.nav-links{
  display:grid;
  grid-template-columns:auto auto;
  column-gap:40px;
  row-gap:2px;
  text-align:left;
}
.nav-links a{
  font-size:13.5px;color:rgba(0,0,0,.7);
  text-decoration:none;font-weight:400;
  cursor:pointer;
  transition:color .15s;
}
.nav-links a:hover{color:#000}

/* 우측 햄버거 */
.burger{
  font-size:22px;color:rgba(0,0,0,.55);
  cursor:pointer;padding-top:3px;
  font-weight:300;line-height:1;
  letter-spacing:2px;
}

/* ━━━ 히어로 텍스트 블록 ━━━
   원본에서 화면 세로 중앙보다 약간 위 (약 35% 지점) */
.hero-block{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-60%);
  text-align:center;
  z-index:20;
  width:100%;
  max-width:800px;
  padding:0 40px;
}

/* Details 알약 버튼 */
.details-pill{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid rgba(0,0,0,.2);
  border-radius:24px;
  padding:5px 16px;
  font-size:12px;color:rgba(0,0,0,.55);
  margin-bottom:20px;
  background:rgba(255,255,255,.45);
  backdrop-filter:blur(8px);
  cursor:pointer;
}

/* 헤드라인 */
.headline{
  font-size:68px;font-weight:700;
  color:#111;
  line-height:1.1;
  letter-spacing:-.04em;
  margin-bottom:18px;
}
/* 인라인 노브 아이콘 */
.knob-inline{
  display:inline-block;
  width:.7em;height:.7em;
  border-radius:50%;
  border:2px solid rgba(0,0,0,.4);
  vertical-align:middle;
  margin:0 2px;
  position:relative;
  top:-.06em;
  background:radial-gradient(circle at 38% 38%,#d8d8d4,#b0b0aa);
  box-shadow:0 2px 6px rgba(0,0,0,.2),inset 0 1px 2px rgba(255,255,255,.5);
}

/* 태그들 */
.tags-row{
  display:flex;justify-content:center;align-items:center;gap:24px;
  margin-bottom:28px;
}
.tag-item{
  display:flex;align-items:center;gap:7px;
  font-size:13px;color:rgba(0,0,0,.55);font-weight:400;
}
.tag-dot{
  width:8px;height:8px;
  background:#c0392b;
  transform:rotate(45deg);
  flex-shrink:0;
}

/* CTA 버튼 */
.cta-row{
  display:flex;justify-content:center;align-items:center;gap:10px;
}
.btn-visit{
  border:1.5px solid rgba(0,0,0,.28);
  border-radius:40px;
  padding:13px 38px;
  font-size:14px;font-weight:400;color:#111;
  background:rgba(255,255,255,.5);backdrop-filter:blur(4px);
  cursor:pointer;font-family:inherit;
  transition:all .2s;
  letter-spacing:.01em;
}
.btn-visit:hover{background:#111;color:#fff;border-color:#111}
.btn-close{
  width:46px;height:46px;
  border-radius:50%;
  background:#111;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:16px;
  cursor:pointer;border:none;
  transition:transform .2s;
  font-family:inherit;
}
.btn-close:hover{transform:rotate(90deg)}

/* ━━━ 제품 영역 (화면 하단 절반) ━━━
   원본에서 노브 4개 + 키보드 베이스가 화면을 가득 채움 */
.products-area{
  position:absolute;
  bottom:0;left:0;right:0;
  /* 화면 높이의 약 48% */
  height:48%;
  z-index:10;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  /* 가로로 여러 노브를 배치 */
  gap:0;
}

/* 키보드 베이스 플레이트 */
.keyboard-plate{
  position:absolute;
  bottom:0;left:0;right:0;
  height:42%;
  background:linear-gradient(to bottom,#d8d8d4 0%,#ccccc8 100%);
  border-top:1px solid rgba(0,0,0,.1);
}
/* 중앙 세로선 */
.keyboard-plate::after{
  content:'';
  position:absolute;
  top:0;bottom:0;left:50%;
  width:1px;
  background:rgba(0,0,0,.1);
}

/* 개별 노브 컨테이너 */
.knob-col{
  position:absolute;
  bottom:42%; /* 키보드 위에서 시작 */
  display:flex;flex-direction:column;align-items:center;
  transform:translateY(50%);
}

/* 노브 몸통 (원통형) */
.knob-body{
  border-radius:8px 8px 2px 2px;
  position:relative;
  overflow:visible;
}
/* 노브 상단 캡 (타원) */
.knob-cap{
  position:absolute;
  top:-1px;left:50%;transform:translateX(-50%);
  border-radius:50%;
  z-index:2;
}
/* 노브 텍스처 줄 */
.knob-lines{
  position:absolute;inset:0;
  border-radius:inherit;
  background-image:repeating-linear-gradient(
    0deg,
    transparent,transparent 2px,
    rgba(0,0,0,.07) 2px,rgba(0,0,0,.07) 3px
  );
}
/* 노브 하단 베이스 */
.knob-base{
  border-radius:50%;
  flex-shrink:0;
}

/* 하단 동그란 버튼들 */
.key-buttons{
  position:absolute;
  bottom:8px;left:0;right:0;
  display:flex;justify-content:center;gap:20px;
  z-index:20;
}
.key-btn{
  border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#3a3a3a,#1a1a1a);
  box-shadow:0 3px 10px rgba(0,0,0,.4);
  flex-shrink:0;
}
</style>
</head>
<body>

<!-- 내비 -->
<nav>
  <div class="logo-box">
    <div class="logo-txt">
      <span>к</span>
      <span class="logo-sym"></span>
    </div>
  </div>

  <div class="nav-links">
    <a>Home</a>
    <a>Blog</a>
    <a>Product</a>
    <a>Contact</a>
    <a>Technology</a>
  </div>

  <div class="burger">≡</div>
</nav>

<!-- 히어로 텍스트 -->
<div class="hero-block">
  <div class="details-pill">🔗 Details</div>
  <h1 class="headline">
    Top-Notch<br>
    Mechanical <span class="knob-inline"></span> Tools
  </h1>
  <div class="tags-row">
    <div class="tag-item"><span class="tag-dot"></span>Reworked</div>
    <div class="tag-item"><span class="tag-dot"></span>Refined</div>
    <div class="tag-item"><span class="tag-dot"></span>Reborn</div>
  </div>
  <div class="cta-row">
    <button class="btn-visit">Visit Store</button>
    <button class="btn-close">✕</button>
  </div>
</div>

<!-- 제품 영역 -->
<div class="products-area">
  <!-- 키보드 플레이트 -->
  <div class="keyboard-plate"></div>

  <!-- 노브 1: 다크 (왼쪽 가장자리) -->
  <div class="knob-col" style="left:4%">
    <div class="knob-body" style="width:72px;height:128px;background:linear-gradient(to right,#2e2e2e,#1e1e1e,#2e2e2e)">
      <div class="knob-cap" style="width:42px;height:18px;background:#1a1a1a;top:-8px"></div>
      <div class="knob-lines"></div>
    </div>
    <div class="knob-base" style="width:80px;height:16px;background:#1a1a1a;margin-top:-2px"></div>
  </div>

  <!-- 노브 2: 골드/브론즈 -->
  <div class="knob-col" style="left:calc(50% - 100px)">
    <div class="knob-body" style="width:80px;height:144px;background:linear-gradient(to right,#c8a050,#d4aa44,#b89038)">
      <div class="knob-cap" style="width:46px;height:22px;background:#b89038;top:-10px"></div>
      <div class="knob-lines"></div>
    </div>
    <div class="knob-base" style="width:90px;height:18px;background:#b08028;margin-top:-2px"></div>
  </div>

  <!-- 노브 3: 실버/회색 -->
  <div class="knob-col" style="left:calc(50% + 28px)">
    <div class="knob-body" style="width:80px;height:144px;background:linear-gradient(to right,#c0c0bc,#d0d0cc,#b4b4b0)">
      <div class="knob-cap" style="width:46px;height:22px;background:#a8a8a4;top:-10px"></div>
      <div class="knob-lines"></div>
    </div>
    <div class="knob-base" style="width:90px;height:18px;background:#a0a09c;margin-top:-2px"></div>
  </div>

  <!-- 노브 4: 레드/오렌지 (오른쪽 가장자리) -->
  <div class="knob-col" style="right:4%">
    <div class="knob-body" style="width:72px;height:128px;background:linear-gradient(to right,#b84030,#c84828,#a83020)">
      <div class="knob-cap" style="width:42px;height:18px;background:#a03018;top:-8px"></div>
      <div class="knob-lines"></div>
    </div>
    <div class="knob-base" style="width:80px;height:16px;background:#902810;margin-top:-2px"></div>
  </div>

  <!-- 하단 원형 버튼들 -->
  <div class="key-buttons">
    <div class="key-btn" style="width:44px;height:44px"></div>
    <div class="key-btn" style="width:44px;height:44px"></div>
    <div class="key-btn" style="width:44px;height:44px;background:radial-gradient(circle at 40% 35%,#444,#222)"></div>
    <div class="key-btn" style="width:44px;height:44px"></div>
    <div class="key-btn" style="width:44px;height:44px"></div>
    <div class="key-btn" style="width:44px;height:44px"></div>
  </div>
</div>

</body>
</html>
